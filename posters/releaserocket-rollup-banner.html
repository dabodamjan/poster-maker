<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReleaseRocket Roll-up Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<!--
  ROLL-UP / PULL-UP BANNER (850 x 2000 mm)
  ========================================
  850 x 2000 mm is the standard roll-up size. Printers differ on the rest:
  Banana Print's template is 856 x 2106 mm with bleed, with 100 mm wrapping
  into the base; other templates hide up to 150 mm in the base cassette.
  So this file is the 850 x 2000 mm visible face, the bottom 150 mm carries
  background only, and the important content sits in the upper part, at
  eye height. Before ordering, place it into your printer's own template
  and extend the background into their bleed.

  Export: node scripts/export.js posters/releaserocket-rollup-banner.html --pdf
  gives a true-size PDF (vector text). The PNG export is capped at 64
  megapixels for this size, which works out to about 155 DPI at full size.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 850mm;
    height: 2000mm;
    background: #061f35;
    color: #f5f0e4;
    font-family: 'Hanken Grotesk', sans-serif;
    font-variant-numeric: lining-nums;
    overflow: hidden;
    position: relative;
  }

  .face {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 1850mm; /* the bottom 150 mm may disappear into the base */
    padding: 110mm 75mm 70mm;
    display: flex;
    flex-direction: column;
  }

  .lockup { display: flex; align-items: center; gap: 22mm; }
  .lockup svg { width: 104mm; height: 100mm; display: block; }
  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 118mm;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .wordmark em { font-style: italic; color: #e6c15c; }

  .headline {
    margin-top: 150mm;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 150mm;
    line-height: 0.94;
    letter-spacing: -0.015em;
  }
  .headline em { font-style: italic; color: #e6c15c; }

  .lede {
    margin-top: 60mm;
    font-size: 36mm;
    line-height: 1.35;
    color: #b8b4a6;
    max-width: 690mm;
  }

  .spacer { flex: 1; }

  .flight { display: block; width: 700mm; height: 418mm; margin-left: auto; }

  .channels {
    margin-top: 50mm;
    border-top: 0.6mm solid #1b3c58;
    font-family: 'DM Mono', monospace;
    font-size: 30mm;
  }
  .channels .row {
    padding: 13mm 0;
    border-bottom: 0.6mm solid #1b3c58;
  }
  .channels .tick { color: #e6c15c; margin-right: 12mm; }

  .url {
    margin-top: 60mm;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 54mm;
    letter-spacing: 0.06em;
    color: #e6c15c;
  }

  @media screen {
    html { height: 100vh; display: flex; justify-content: center; align-items: center; background: #0f1010; }
    body { flex-shrink: 0; }
  }

  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="face">
    <div class="lockup">
      <!-- Mark paths: assets/releaserocket-brand/releaserocket-mark.svg (locked geometry) -->
      <svg viewBox="84 88 187 180" fill="#e6c15c" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ReleaseRocket">
        <path d="M268.6 90.4 C261.3 104.5 251.1 120.7 228.8 150.2 C219.7 162.3 220 161.9 215.7 173.1 C212 182.7 207.5 196.8 202.7 213.8 C200.1 223 197.5 231.6 197.1 232.9 C196 235.6 193.4 240.8 193 241.2 C189.5 233.9 179 211.6 174.3 207 C171.8 204.4 171.3 204.4 163.6 207.2 L157.1 209.6 L144.4 197.3 L146.9 191 C148.3 187.5 149.4 184.1 149.4 183.6 C149.4 182.4 147.9 180.2 146 178.7 C143.3 176.6 137 173.1 125.8 167.3 L114.2 161.5 C116.7 159.7 120.2 158 122.6 157.2 C123.8 156.8 130 155.1 136.3 153.5 C163.3 146.4 175 142.7 189.3 136.7 C195.6 134.1 196.3 133.7 202.1 129.5 C223.2 114.4 247.7 99.2 268.6 90.4 Z"/>
        <path d="M144.5 205.1 C143.2 205.8 88.4 261.5 86.8 263.7 C85.7 265.2 86.8 265 88.5 263.6 C93.6 259.1 108.3 245.9 118.8 236.4 C146.4 211.6 149 209.2 149.1 208.3 C149.3 207.2 148.6 205.5 147.7 205 C146.8 204.5 145.6 204.5 144.5 205.1 Z"/>
      </svg>
      <span class="wordmark">Release<em>Rocket</em></span>
    </div>

    <h1 class="headline">Reach more<br>people with<br><em>every</em><br>release.</h1>

    <p class="lede">Drafts for every channel, built from your GitHub releases. You review, then publish.</p>

    <div class="spacer"></div>

    <svg class="flight" viewBox="-380 70 670 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="trailRu" gradientUnits="userSpaceOnUse" x1="-370" y1="450" x2="144" y2="209">
          <stop offset="0" stop-color="#e6c15c" stop-opacity="0"/>
          <stop offset="1" stop-color="#e6c15c" stop-opacity="0.9"/>
        </linearGradient>
      </defs>
      <path d="M-370 455 C-170 452 -40 380 28 318.8 C70 282 110 240 144 208.7" fill="none" stroke="url(#trailRu)" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="0 10"/>
      <g fill="#e6c15c">
        <path d="M268.6 90.4 C261.3 104.5 251.1 120.7 228.8 150.2 C219.7 162.3 220 161.9 215.7 173.1 C212 182.7 207.5 196.8 202.7 213.8 C200.1 223 197.5 231.6 197.1 232.9 C196 235.6 193.4 240.8 193 241.2 C189.5 233.9 179 211.6 174.3 207 C171.8 204.4 171.3 204.4 163.6 207.2 L157.1 209.6 L144.4 197.3 L146.9 191 C148.3 187.5 149.4 184.1 149.4 183.6 C149.4 182.4 147.9 180.2 146 178.7 C143.3 176.6 137 173.1 125.8 167.3 L114.2 161.5 C116.7 159.7 120.2 158 122.6 157.2 C123.8 156.8 130 155.1 136.3 153.5 C163.3 146.4 175 142.7 189.3 136.7 C195.6 134.1 196.3 133.7 202.1 129.5 C223.2 114.4 247.7 99.2 268.6 90.4 Z"/>
        <path d="M144.5 205.1 C143.2 205.8 88.4 261.5 86.8 263.7 C85.7 265.2 86.8 265 88.5 263.6 C93.6 259.1 108.3 245.9 118.8 236.4 C146.4 211.6 149 209.2 149.1 208.3 C149.3 207.2 148.6 205.5 147.7 205 C146.8 204.5 145.6 204.5 144.5 205.1 Z"/>
      </g>
    </svg>

    <div class="channels">
      <div class="row"><span class="tick">&#10003;</span>Release notes</div>
      <div class="row"><span class="tick">&#10003;</span>Posts for X and LinkedIn</div>
      <div class="row"><span class="tick">&#10003;</span>Newsletters</div>
    </div>

    <div class="url">releaserocket.io</div>
  </div>

  <script>
    (function() {
      const rect = document.body.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      function fit() {
        const s = Math.min(window.innerWidth / w, window.innerHeight / h, 1);
        document.body.style.transform = 'scale(' + s + ')';
        document.body.style.transformOrigin = 'top left';
        document.body.style.position = 'absolute';
        document.body.style.left = ((window.innerWidth - w * s) / 2) + 'px';
        document.body.style.top = ((window.innerHeight - h * s) / 2) + 'px';
      }
      fit();
      window.addEventListener('resize', fit);
    })();
  </script>
</body>
</html>
