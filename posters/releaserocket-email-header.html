<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReleaseRocket Email Header</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  EMAIL NEWSLETTER HEADER (600x200)
  =================================
  600 px is the classic email body width (Mailchimp's legacy templates are
  600 px wide; its newer builder is 660 px). export.js renders at 2x, so
  the PNG is 1200 x 400: upload it and let the email display it at 600 px
  wide, which keeps it sharp on high-density screens.

  Text in an email header image is invisible to screen readers and to
  clients that block images, so repeat the heading as live text or alt text.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 600px;
    height: 200px;
    overflow: hidden;
    position: relative;
    background: #061f35;
    color: #f5f0e4;
    font-variant-numeric: lining-nums;
  }

  .frame {
    position: absolute;
    inset: 0;
    padding: 34px 40px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .lockup { display: flex; align-items: center; gap: 9px; }
  .lockup svg { width: 23px; height: 22px; display: block; }
  .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 27px;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .wordmark em { font-style: italic; color: #e6c15c; }

  .title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 500;
    font-size: 50px;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .title em { font-style: italic; color: #e6c15c; }

  .meta {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid #1b3c58;
    padding-top: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.14em;
    color: #b8b4a6;
    text-transform: uppercase;
  }

  .flight { position: absolute; right: 26px; top: 18px; width: 200px; height: 112px; display: block; }

  @media screen {
    html { height: 100vh; display: flex; justify-content: center; align-items: center; background: #0f1010; }
    body { flex-shrink: 0; }
  }

  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <!-- Mark paths: assets/releaserocket-brand/releaserocket-mark.svg (locked geometry) -->
  <svg class="flight" viewBox="-380 70 670 376" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="trailEm" gradientUnits="userSpaceOnUse" x1="-370" y1="430" x2="144" y2="209">
        <stop offset="0" stop-color="#e6c15c" stop-opacity="0"/>
        <stop offset="1" stop-color="#e6c15c" stop-opacity="0.9"/>
      </linearGradient>
    </defs>
    <path d="M-370 432 C-170 430 -40 380 28 318.8 C70 282 110 240 144 208.7" fill="none" stroke="url(#trailEm)" stroke-width="7" stroke-linecap="round" stroke-dasharray="0 20"/>
    <g fill="#e6c15c">
      <path d="M268.6 90.4 C261.3 104.5 251.1 120.7 228.8 150.2 C219.7 162.3 220 161.9 215.7 173.1 C212 182.7 207.5 196.8 202.7 213.8 C200.1 223 197.5 231.6 197.1 232.9 C196 235.6 193.4 240.8 193 241.2 C189.5 233.9 179 211.6 174.3 207 C171.8 204.4 171.3 204.4 163.6 207.2 L157.1 209.6 L144.4 197.3 L146.9 191 C148.3 187.5 149.4 184.1 149.4 183.6 C149.4 182.4 147.9 180.2 146 178.7 C143.3 176.6 137 173.1 125.8 167.3 L114.2 161.5 C116.7 159.7 120.2 158 122.6 157.2 C123.8 156.8 130 155.1 136.3 153.5 C163.3 146.4 175 142.7 189.3 136.7 C195.6 134.1 196.3 133.7 202.1 129.5 C223.2 114.4 247.7 99.2 268.6 90.4 Z"/>

  <div class="frame">
    <div class="lockup">
      <!-- 22px, so the small drawing: assets/releaserocket-brand/releaserocket-mark-24.svg -->
      <svg viewBox="84 88 187 180" fill="#e6c15c" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ReleaseRocket">

      <span class="wordmark">Release<em>Rocket</em></span>
    </div>

    <div class="title">Product <em>updates</em></div>

    <div class="meta">
      <span>What shipped, in one email</span>
      <span>releaserocket.io</span>
    </div>
  </div>

  <script>
    (function() {
      const rect = document.body.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      function fit() {
        const s = Math.min(window.innerWidth / w, window.innerHeight / h, 1);
        document.body.style.transform = 'scale(' + s + ')';
        document.body.style.transformOrigin = 'top left';
        document.body.style.position = 'absolute';
        document.body.style.left = ((window.innerWidth - w * s) / 2) + 'px';
        document.body.style.top = ((window.innerHeight - h * s) / 2) + 'px';
      }
      fit();
      window.addEventListener('resize', fit);
    })();
  </script>
</body>
</html>
