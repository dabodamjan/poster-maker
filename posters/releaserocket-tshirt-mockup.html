<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReleaseRocket T-shirt Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  T-SHIRT GALLERY PREVIEW (1600x1000)
  ===================================
  Shows the two print files in use on a deep silk blue tee drawn in SVG.
  This is the gallery image, not a print file. The print files are
  posters/releaserocket-tshirt-front.html and -back.html; their artwork is
  repeated here at true scale (shirt drawn at 18 units per inch, so the
  4 in chest print is 72 units and the 12 in back print 216 units wide).
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1600px;
    height: 1000px;
    overflow: hidden;
    position: relative;
    background: #f7f1e1;
    color: #082a45;
    font-variant-numeric: lining-nums;
  }

  .stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 70px;
    padding-bottom: 40px;
  }

  .garment { position: relative; width: 660px; height: 704px; }
  .garment > svg.tee { position: absolute; inset: 0; width: 660px; height: 704px; display: block; }

  .caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -58px;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.14em;
    color: #4e6273;
    text-transform: uppercase;
  }
  .caption b { font-weight: 500; color: #88620c; }

  /* Print areas: the print files' own markup at their CSS size, scaled
     into place (1.1 px per shirt unit, 150 CSS px per print inch). */
  .print { position: absolute; transform-origin: top left; transform: scale(0.132); }
  .print.front { left: 373px; top: 138px; width: 600px; height: 600px; display: flex; align-items: center; justify-content: center; }
  .print.back { left: 211px; top: 92px; width: 1800px; height: 2400px; }

  /* Front artwork (from releaserocket-tshirt-front.html) */
  .front .lockup { display: flex; align-items: center; gap: 22px; }
  .front .lockup svg { width: 79px; height: 76px; display: block; }
  .front .wordmark { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 88px; letter-spacing: -0.01em; line-height: 1; color: #f5f0e4; }
  .front .wordmark em { font-style: italic; color: #e6c15c; }

  /* Back artwork (from releaserocket-tshirt-back.html) */
  .back { color: #f5f0e4; }
  .back .art { padding-top: 120px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .back .flight { width: 1560px; height: 932px; display: block; }
  .back .headline { margin-top: 90px; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 200px; line-height: 0.95; letter-spacing: -0.01em; }
  .back .headline em { font-style: italic; color: #e6c15c; }
  .back .url { margin-top: 110px; font-family: 'DM Mono', monospace; font-weight: 500; font-size: 64px; letter-spacing: 0.12em; color: #e6c15c; }

  @media screen {
    html { height: 100vh; display: flex; justify-content: center; align-items: center; background: #0f1010; }
    body { flex-shrink: 0; }
  }

  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000" stop-opacity="0.22"/>
        <stop offset="0.18" stop-color="#000" stop-opacity="0"/>
        <stop offset="0.5" stop-color="#fff" stop-opacity="0.05"/>
        <stop offset="0.82" stop-color="#000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000" stop-opacity="0.22"/>
      </linearGradient>
      <path id="markBody" d="M268.6 90.4 C261.3 104.5 251.1 120.7 228.8 150.2 C219.7 162.3 220 161.9 215.7 173.1 C212 182.7 207.5 196.8 202.7 213.8 C200.1 223 197.5 231.6 197.1 232.9 C196 235.6 193.4 240.8 193 241.2 C189.5 233.9 179 211.6 174.3 207 C171.8 204.4 171.3 204.4 163.6 207.2 L157.1 209.6 L144.4 197.3 L146.9 191 C148.3 187.5 149.4 184.1 149.4 183.6 C149.4 182.4 147.9 180.2 146 178.7 C143.3 176.6 137 173.1 125.8 167.3 L114.2 161.5 C116.7 159.7 120.2 158 122.6 157.2 C123.8 156.8 130 155.1 136.3 153.5 C163.3 146.4 175 142.7 189.3 136.7 C195.6 134.1 196.3 133.7 202.1 129.5 C223.2 114.4 247.7 99.2 268.6 90.4 Z"/>
      <path id="markShaft" d="M144.5 205.1 C143.2 205.8 88.4 261.5 86.8 263.7 C85.7 265.2 86.8 265 88.5 263.6 C93.6 259.1 108.3 245.9 118.8 236.4 C146.4 211.6 149 209.2 149.1 208.3 C149.3 207.2 148.6 205.5 147.7 205 C146.8 204.5 145.6 204.5 144.5 205.1 Z"/>
    </defs>
  </svg>

  <div class="stage">
    <!-- FRONT -->
    <div class="garment">
      <svg class="tee" viewBox="0 0 600 640" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M200 30 C245 88 355 88 400 30 L520 72 L592 222 L500 262 L480 224 L480 618 Q300 634 120 618 L120 224 L100 262 L8 222 L80 72 Z" fill="#061f35"/>
        <path d="M200 30 C245 88 355 88 400 30 L520 72 L592 222 L500 262 L480 224 L480 618 Q300 634 120 618 L120 224 L100 262 L8 222 L80 72 Z" fill="url(#fold)"/>
        <path d="M204 33 C247 92 353 92 396 33" fill="none" stroke="#0c2a45" stroke-width="12" stroke-linecap="round"/>
        <path d="M120 224 L136 200 M480 224 L464 200" stroke="#000" stroke-opacity="0.18" stroke-width="2" fill="none"/>
        <path d="M22 214 L102 249 M578 214 L498 249" stroke="#000" stroke-opacity="0.2" stroke-width="2" fill="none"/>
      </svg>
      <div class="print front">
        <div class="lockup">
          <svg viewBox="84 88 187 180" fill="#e6c15c" xmlns="http://www.w3.org/2000/svg"><use href="#markBody"/><use href="#markShaft"/></svg>
          <span class="wordmark">Release<em>Rocket</em></span>
        </div>
      </div>
      <div class="caption">Front &middot; <b>left chest, 4 x 4 in</b></div>
    </div>

    <!-- BACK -->
    <div class="garment">
      <svg class="tee" viewBox="0 0 600 640" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M200 30 C250 50 350 50 400 30 L520 72 L592 222 L500 262 L480 224 L480 618 Q300 634 120 618 L120 224 L100 262 L8 222 L80 72 Z" fill="#061f35"/>
        <path d="M200 30 C250 50 350 50 400 30 L520 72 L592 222 L500 262 L480 224 L480 618 Q300 634 120 618 L120 224 L100 262 L8 222 L80 72 Z" fill="url(#fold)"/>
        <path d="M204 33 C252 54 348 54 396 33" fill="none" stroke="#0c2a45" stroke-width="10" stroke-linecap="round"/>
        <path d="M120 224 L136 200 M480 224 L464 200" stroke="#000" stroke-opacity="0.18" stroke-width="2" fill="none"/>
        <path d="M22 214 L102 249 M578 214 L498 249" stroke="#000" stroke-opacity="0.2" stroke-width="2" fill="none"/>
      </svg>
      <div class="print back">
        <div class="art">
          <svg class="flight" viewBox="-380 70 670 400" xmlns="http://www.w3.org/2000/svg">
            <path d="M-370 455 C-170 452 -40 380 28 318.8 C70 282 110 240 144 208.7" fill="none" stroke="#e6c15c" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 15"/>
            <g fill="#e6c15c"><use href="#markBody"/><use href="#markShaft"/></g>
          </svg>
          <div class="headline">Reach more people<br>with <em>every</em> release.</div>
          <div class="url">RELEASEROCKET.IO</div>
        </div>
      </div>
      <div class="caption">Back &middot; <b>12 x 16 in</b></div>
    </div>
  </div>

  <script>
    (function() {
      const rect = document.body.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      function fit() {
        const s = Math.min(window.innerWidth / w, window.innerHeight / h, 1);
        document.body.style.transform = 'scale(' + s + ')';
        document.body.style.transformOrigin = 'top left';
        document.body.style.position = 'absolute';
        document.body.style.left = ((window.innerWidth - w * s) / 2) + 'px';
        document.body.style.top = ((window.innerHeight - h * s) / 2) + 'px';
      }
      fit();
      window.addEventListener('resize', fit);
    })();
  </script>
</body>
</html>
