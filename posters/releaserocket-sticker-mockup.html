<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReleaseRocket Sticker Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  STICKER GALLERY PREVIEW (1600x1000)
  ===================================
  The die-cut sticker from posters/releaserocket-sticker.html on a laptop
  lid drawn in CSS. Gallery image only; the print file is the sticker
  poster. Scale: the lid is a 12 in wide laptop at about 92 px per inch,
  so the 3 in sticker is drawn 276 px wide.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1600px;
    height: 1000px;
    overflow: hidden;
    position: relative;
    background: #f7f1e1;
  }

  /* Laptop lid, seen from above, in the brand's warm grey. */
  .lid {
    position: absolute;
    left: 250px;
    top: 110px;
    width: 1100px;
    height: 720px;
    border-radius: 34px;
    background:
      linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 45%),
      linear-gradient(0deg, rgba(0, 0, 0, 0.06), rgba(0, 0, 0, 0)),
      #b8b4a6;
    box-shadow: 0 40px 80px -30px rgba(8, 42, 69, 0.45), inset 0 0 0 2px rgba(0, 0, 0, 0.06);
  }

  /* Hinge strip along the lid's lower edge. */
  .hinge {
    position: absolute;
    left: 330px;
    top: 830px;
    width: 940px;
    height: 14px;
    border-radius: 0 0 10px 10px;
    background: #4e6273;
    opacity: 0.55;
  }

  .sticker {
    position: absolute;
    width: 276px;
    height: 276px;
    border-radius: 71px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 3px rgba(0, 0, 0, 0.18), 0 10px 18px -8px rgba(0, 0, 0, 0.25);
  }
  .sticker svg { width: 252px; height: 252px; display: block; }
  .sticker.main { left: 820px; top: 330px; transform: rotate(-9deg); }

  .caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 62px;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    letter-spacing: 0.14em;
    color: #4e6273;
    text-transform: uppercase;
  }
  .caption b { font-weight: 500; color: #88620c; }

  @media screen {
    html { height: 100vh; display: flex; justify-content: center; align-items: center; background: #0f1010; }
    body { flex-shrink: 0; }
  }

  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="lid"></div>
  <div class="hinge"></div>

  <div class="sticker main">
    <svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ReleaseRocket sticker">
      <rect width="360" height="360" rx="84" fill="#061F35"/>
      <g fill="#E6C15C" transform="translate(180 180) scale(1.2) translate(-177.7 -177.8)">
        <path d="M268.6 90.4 C261.3 104.5 251.1 120.7 228.8 150.2 C219.7 162.3 220 161.9 215.7 173.1 C212 182.7 207.5 196.8 202.7 213.8 C200.1 223 197.5 231.6 197.1 232.9 C196 235.6 193.4 240.8 193 241.2 C189.5 233.9 179 211.6 174.3 207 C171.8 204.4 171.3 204.4 163.6 207.2 L157.1 209.6 L144.4 197.3 L146.9 191 C148.3 187.5 149.4 184.1 149.4 183.6 C149.4 182.4 147.9 180.2 146 178.7 C143.3 176.6 137 173.1 125.8 167.3 L114.2 161.5 C116.7 159.7 120.2 158 122.6 157.2 C123.8 156.8 130 155.1 136.3 153.5 C163.3 146.4 175 142.7 189.3 136.7 C195.6 134.1 196.3 133.7 202.1 129.5 C223.2 114.4 247.7 99.2 268.6 90.4 Z"/>
        <path d="M144.5 205.1 C143.2 205.8 88.4 261.5 86.8 263.7 C85.7 265.2 86.8 265 88.5 263.6 C93.6 259.1 108.3 245.9 118.8 236.4 C146.4 211.6 149 209.2 149.1 208.3 C149.3 207.2 148.6 205.5 147.7 205 C146.8 204.5 145.6 204.5 144.5 205.1 Z"/>
      </g>
    </svg>
  </div>

  <div class="caption">Die-cut sticker &middot; <b>3 x 3 in, white border</b></div>

  <script>
    (function() {
      const rect = document.body.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      function fit() {
        const s = Math.min(window.innerWidth / w, window.innerHeight / h, 1);
        document.body.style.transform = 'scale(' + s + ')';
        document.body.style.transformOrigin = 'top left';
        document.body.style.position = 'absolute';
        document.body.style.left = ((window.innerWidth - w * s) / 2) + 'px';
        document.body.style.top = ((window.innerHeight - h * s) / 2) + 'px';
      }
      fit();
      window.addEventListener('resize', fit);
    })();
  </script>
</body>
</html>
