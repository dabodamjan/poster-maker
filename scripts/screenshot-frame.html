<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    overflow: hidden;
  }
  body {
    background: {{BG_COLOR}};
    display: flex;
    align-items: center;
    justify-content: center;
    padding: {{PADDING_Y}}px {{PADDING_X}}px;
  }
  .frame {
    max-width: 100%;
    max-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 24px 48px rgba(0, 0, 0, 0.22));
  }
  .screenshot {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 14px;
  }
</style>
</head>
<body>
  <div class="frame">
    <img class="screenshot" src="{{IMAGE_DATA_URL}}" />
  </div>
</body>
</html>
